name: Auto Sync Build Suggestions

on:
  schedule:
    - cron: '0 3 * * *' # 1 vez al día
  workflow_dispatch: # Ejecución manual

jobs:
  sync-builds:
    name: Sincronizar Sugerencias de Builds
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Generar archivo de sugerencias
        run: node scripts/sync-builds.js

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/build-suggestions.json
          git commit -m "🤖 Actualización automática de sugerencias del meta" || exit 0
          git push