name: Auto Sync Banners

on:
  schedule:
    - cron: '0 0,12 * * *' # 2 veces al día
  workflow_dispatch: # Ejecución manual

jobs:
  sync-banners:
    name: Sincronizar Banners
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar sincronización de banners
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sync-banners.js